<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHÁT BÓNG ĐÁ TRỰC TIẾP</title>
    <style>
        /* Tối ưu màn hình đen tuyệt đối, không viền */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        video { width: 100%; height: 100%; background: #000; outline: none; }
        
        /* Chữ thông báo nhỏ khi đang load, tự ẩn sau 3 giây */
        #loading { 
            position: fixed; top: 10px; left: 10px; color: #00ff00; 
            font-family: sans-serif; font-size: 14px; z-index: 10; 
        }
    </style>
</head>
<body>

    <div id="loading">🚀 Đang nạp luồng phát...</div>

    <video id="tv-player" controls playsinline autoplay>
        <source src="https://tfuk3graucmttgy31hctogyzdkc3ppbasa4mscwz8w5d3ptwzc3jqcpzs4.100ycdn.com/hqlive.zlylive.com/live/hqtv_blv_phanliem/playlist.m3u8?wsSession=5607d1753b9dccf6a52af36a-177468068158210&wsIPSercert=93868f628490538264992a2811d87a73&wsiphost=local&wsBindIP=1" type="application/x-mpegURL">
        Trình duyệt TV của bạn không hỗ trợ định dạng này.
    </video>

    <script>
        var video = document.getElementById('tv-player');

        // Tự động phát ngay khi nạp xong
        window.onload = function() {
            video.play().catch(function(e) {
                console.log("Cần tương tác để phát hoặc lỗi link.");
            });
            
            // Ẩn chữ thông báo sau 3 giây cho đỡ ngứa mắt
            setTimeout(function() {
                document.getElementById('loading').style.display = 'none';
            }, 3000);
        };

        // Bắt phím Back/Return trên điều khiển để thoát hoặc tải lại
        window.addEventListener('keydown', function(e) {
            if (e.keyCode === 8 || e.keyCode === 27 || e.keyCode === 10009) {
                e.preventDefault();
                // Nếu muốn thoát hẳn trang web, dùng history.back()
                // Nếu muốn nạp lại trận đấu, dùng location.reload()
                window.location.reload(); 
            }
        });

        // Tự động thử lại nếu luồng bị ngắt giữa chừng (do mạng yếu)
        video.addEventListener('error', function() {
            setTimeout(function() {
                video.load();
                video.play();
            }, 2000);
        }, true);
    </script>
</body>
</html>
