<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang chuyển hướng đến Tivi Bóng Đá...</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid #1e293b;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        a { color: #38bdf8; text-decoration: none; font-weight: bold; margin-top: 10px; }
        .btn { background: #3b82f6; color: white; padding: 10px 20px; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="loader"></div>
    <h2>Hệ thống đang chuyển hướng...</h2>
    <p>Vui lòng đợi trong giây lát để kết nối với máy chủ.</p>
    
    <p>Nếu trang không tự chuyển, bấm vào đây:</p>
    <a href="https://bdl.nphotos0001.workers.dev/" class="btn">VÀO XEM BÓNG ĐÁ</a>

    <script>
        // Cách 3: JavaScript - Chuyển hướng nhanh nếu trình duyệt hỗ trợ
        // Sử dụng setTimeout 2 giây để tạo độ trễ "tự nhiên", tránh bị bot quét
        setTimeout(function() {
            window.location.replace("https://bdl.nphotos0001.workers.dev/");
        }, 2000);
    </script>
</body>
